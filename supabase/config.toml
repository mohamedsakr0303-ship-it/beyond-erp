# Supabase CLI project settings (only what this app uses). The hosted project is linked in CI with --project-ref.
project_id = "beyond-erp"

[api]
schemas = ["public"]

[auth]
site_url = "http://localhost:8765"
enable_signup = true

# two-step sign-in with an authenticator app (on by default on hosted projects); the books then need a session that
# passed it (supabase/migrations/20261017000000_two_step.sql)
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# username + password sign-in: called before people are signed in, so no JWT check (it checks the password itself)
[functions.login]
verify_jwt = false

# create / update sign-in accounts from the Users screen: checks the caller's token itself
[functions.manage-user]
verify_jwt = false

# subscription payments: Paymob's callback carries no JWT (it is checked by HMAC); the checkout checks the caller's token itself
[functions.billing]
verify_jwt = false

# the AI assistant: checks the caller's token itself, then calls the provider with the company's key (kept in ai_config)
[functions.ai]
verify_jwt = false
