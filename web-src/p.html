<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BeyondERP</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f5f6fb;--panel:#fff;--ink:#141a2e;--muted:#68708a;--line:#e3e6ef;--brand:#4f46e5;--brand-ink:#fff;--ok:#16a34a;--bad:#dc2626;--shadow:0 10px 30px rgba(20,26,46,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d1a;--panel:#141831;--ink:#eef0ff;--muted:#9aa1c4;--line:#262c4d;--shadow:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
header .co{font-weight:700;font-size:1.05em}header .t{color:var(--muted);font-size:.9em}
header .sp{flex:1}
.lang{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
h1{font-size:1.35em;margin:0 0 6px}h2{font-size:1.05em;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:.85em}
label{display:block;font-weight:600;font-size:.88em;margin:12px 0 5px}
input,textarea,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad)}.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row .sp{flex:1}
.full{width:100%}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--bg);text-align:start;color:var(--ink);font:inherit}
.opt b{flex:1}.opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--bg))}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:none;min-width:64px;padding:8px 6px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:center;font:inherit}
.day small{display:block;color:var(--muted);font-size:.75em}.day b{font-size:1.15em}
.day.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}.day.on small{color:inherit}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.tm{padding:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;font-weight:600}
.tm.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ok{color:var(--ok)}.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:12px;padding:10px 12px;margin-top:12px}
.big-ok{font-size:2.4em;line-height:1}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--brand) 14%,transparent);font-size:.82em;font-weight:600}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}td.n{text-align:end;white-space:nowrap}
.doc p{white-space:pre-wrap;margin:6px 0 0}
canvas.sig{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:14px;background:var(--bg);touch-action:none;cursor:crosshair}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;padding:4px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.msg small{display:block;opacity:.7;font-size:.72em;margin-top:2px}
.foot{text-align:center;color:var(--muted);font-size:.78em;margin-top:24px}
.foot a{color:inherit}
[dir=rtl] .msg.me{align-self:flex-start}
</style>
</head>
<body>
<div class="wrap"><header><div><div class="co" id="co">…</div><div class="t" id="pt"></div></div><span class="sp"></span><button class="lang" id="lang"></button></header>
<main id="main"><div class="card muted">…</div></main>
<div class="foot">Powered by <a href="./" rel="noopener">BeyondERP</a></div></div>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const hp = new URLSearchParams(location.hash.slice(1)), TOK = hp.get("t") || "";
let L = (localStorage.getItem("berp.p.lang") || (navigator.language || "en")).slice(0, 2) === "ar" ? "ar" : "en";
const T = (en, ar) => L === "ar" ? ar : en;
const cfgc = window.BEYOND_CLOUD_CONFIG || {};
const store = { get: k => { try { return JSON.parse(localStorage.getItem("berp.p." + k) || "null"); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem("berp.p." + k, JSON.stringify(v)); } catch {} } };
async function rpc(name, body) {
  if (!cfgc.url || !cfgc.key) throw new Error(T("This page is not connected yet.", "هذه الصفحة غير متصلة بعد."));
  let r;
  try { r = await fetch(cfgc.url.replace(/\/+$/, "") + "/rest/v1/rpc/" + name, { method: "POST", headers: { apikey: cfgc.key, Authorization: "Bearer " + cfgc.key, "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
  catch { throw new Error(T("No connection — check your internet and try again.", "لا يوجد اتصال — تحقق من الإنترنت وحاول مرة أخرى.")); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch { j = { message: txt }; }
  if (!r.ok) throw new Error((j && (j.message || j.msg)) || ("Error " + r.status));
  // something new reached the company: let its people know on their phones (the server checks it really arrived)
  if (name === "public_send" || (name === "public_manage" && body.p_action))
    fetch(cfgc.url.replace(/\/+$/, "") + "/functions/v1/push", { method: "POST", headers: { apikey: cfgc.key, Authorization: "Bearer " + cfgc.key, "Content-Type": "application/json" },
      body: JSON.stringify({ action: "visitor", token: TOK }) }).catch(() => {});
  return j;
}
let PG = null;
const ttl = () => PG ? (L === "ar" && PG.config && PG.config.title_ar ? PG.config.title_ar : PG.title) : "";
const main = () => $("#main");
const fail = (e, box) => { const b = box || $("#err"); if (b) { b.hidden = false; b.className = "err"; b.textContent = e.message || String(e); } else alert(e.message || e); };
const fmtDate = (iso, opts) => new Date(iso + "T12:00:00").toLocaleDateString(L === "ar" ? "ar-EG" : "en-GB", opts || { weekday: "long", day: "numeric", month: "long" });
const pad = n => String(n).padStart(2, "0");
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const nm = o => L === "ar" && o.name_ar ? o.name_ar : o.name;
// a service's price, when the page shows prices (with the company's currency)
const priceOf = s => PG && PG.config && PG.config.show_prices && s && +s.price ? `${Number(s.price).toLocaleString(L === "ar" ? "ar-EG" : "en-US")}${PG.config.currency ? " " + PG.config.currency : ""}` : "";
function header() {
  $("#co").textContent = PG ? PG.company || "" : ""; $("#pt").textContent = ttl();
  document.title = (PG && (PG.title || PG.company)) || "BeyondERP";
  document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  $("#lang").textContent = L === "ar" ? "English" : "عربي";
  if (PG && PG.config && /^#[0-9a-f]{6}$/i.test(PG.config.color || "")) document.documentElement.style.setProperty("--brand", PG.config.color);
}
$("#lang").onclick = () => { L = L === "ar" ? "en" : "ar"; store.set("lang", L); try { localStorage.setItem("berp.p.lang", L); } catch {} render(); };

// ---------------------------------------------------------------- booking
const B = { svc: null, day: null, time: null, moving: false };
function slotsFor(day) {
  const c = PG.config, step = Math.max(5, +c.slot || 30), [fh, fm] = (c.from || "09:00").split(":").map(Number), [th, tmm] = (c.to || "17:00").split(":").map(Number);
  const dur = Math.max(step, +((B.svc && B.svc.minutes) || step));
  const held = {}; (PG.held || []).forEach(h => held[h.slot] = h.n);
  const busy = new Set(c.busy || []), cap = Math.max(1, +c.per_slot || 1), now = new Date(), notice = (+c.notice_hours || 1) * 3600e3;
  const out = [];
  for (let m = fh * 60 + fm; m + dur <= th * 60 + tmm; m += step) {
    const t = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`, slot = `${day} ${t}`;
    if (new Date(`${day}T${t}:00`) - now < notice) continue;
    if (busy.has(slot) || (held[slot] || 0) >= cap) continue;
    out.push(t);
  }
  return out;
}
function bookingDays() {
  const c = PG.config, days = (c.days && c.days.length ? c.days : [0, 1, 2, 3, 4, 6]).map(Number), out = [], d = new Date();
  const off = new Set(c.closed || []);
  for (let i = 0; i < Math.min(120, +c.ahead || 30); i++) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i); const iso = isoDay(x);
    if (days.includes(x.getDay()) && !off.has(iso) && slotsFor(iso).length) out.push(iso); }
  return out;
}
function bookingView() {
  const c = PG.config, svcs = c.services || [], mine = store.get("bk:" + TOK);
  if (!B.svc && svcs.length === 1) B.svc = svcs[0];
  const days = bookingDays(); if (B.day && !days.includes(B.day)) B.day = null; if (!B.day) B.day = days[0] || null;
  const times = B.day ? slotsFor(B.day) : [];
  main().innerHTML = (mine && !B.moving ? `<div class="card row"><span>${esc(T("You have a booking here.", "لديك حجز هنا."))}</span><span class="sp"></span><a class="btn" href="#t=${encodeURIComponent(TOK)}&r=${encodeURIComponent(mine.ref)}&m=${encodeURIComponent(mine.manage)}">${esc(T("See my booking", "عرض حجزي"))}</a></div>` : "") +
    `<div class="card"><h1>${esc(B.moving ? T("Choose a new time", "اختر موعداً جديداً") : (ttl() || T("Book an appointment", "احجز موعداً")))}</h1>${c.note ? `<p class="muted">${esc(c.note)}</p>` : ""}
    ${svcs.length && !B.moving ? `<h2>${esc(T("1. What do you need?", "١. ما الخدمة المطلوبة؟"))}</h2><div class="opts">${svcs.map((s, i) => `<button type="button" class="opt ${B.svc === s ? "on" : ""}" data-svc="${i}"><b>${esc(nm(s))}</b>${s.minutes ? `<span class="muted small">${s.minutes} ${esc(T("min", "دقيقة"))}</span>` : ""}${priceOf(s) ? `<span class="chip">${esc(priceOf(s))}</span>` : ""}</button>`).join("")}</div>` : ""}
    ${!svcs.length || B.svc || B.moving ? `<h2 style="margin-top:18px">${esc(B.moving ? T("Day", "اليوم") : T("2. Pick a day", "٢. اختر اليوم"))}</h2>
      ${days.length ? `<div class="days">${days.map(d => { const x = new Date(d + "T12:00:00"); return `<button type="button" class="day ${d === B.day ? "on" : ""}" data-day="${d}"><small>${esc(x.toLocaleDateString(L === "ar" ? "ar-EG" : "en-GB", { weekday: "short" }))}</small><b>${x.getDate()}</b><small>${esc(x.toLocaleDateString(L === "ar" ? "ar-EG" : "en-GB", { month: "short" }))}</small></button>`; }).join("")}</div>
      <h2 style="margin-top:16px">${esc(B.moving ? T("Time", "الوقت") : T("3. Pick a time", "٣. اختر الوقت"))}</h2>${times.length ? `<div class="times">${times.map(t => `<button type="button" class="tm ${t === B.time ? "on" : ""}" data-time="${t}">${t}</button>`).join("")}</div>` : `<p class="muted">${esc(T("No free times this day.", "لا توجد مواعيد متاحة في هذا اليوم."))}</p>`}`
      : `<p class="muted">${esc(T("No free days in the coming weeks — please contact us.", "لا توجد أيام متاحة في الأسابيع القادمة — تواصل معنا."))}</p>`}` : ""}
    </div>` +
    (B.time ? (B.moving ? `<div class="card"><button class="btn pri full" id="mv">${esc(T("Move my booking to ", "نقل الحجز إلى ") + fmtDate(B.day) + " " + B.time)}</button><div id="err" hidden></div></div>` :
    `<div class="card"><h2>${esc(T("4. Your details", "٤. بياناتك"))}</h2>${B.svc ? `<p class="muted">${esc(nm(B.svc))}${priceOf(B.svc) ? ` — <b>${esc(priceOf(B.svc))}</b>` : ""}</p>` : ""}<form id="bf">
      <label>${esc(T("Full name", "الاسم بالكامل"))} *</label><input name="name" required autocomplete="name">
      <label>${esc(T("Mobile number", "رقم الموبايل"))} *</label><input name="phone" required inputmode="tel" autocomplete="tel" dir="ltr">
      <label>${esc(T("Email (optional)", "البريد الإلكتروني (اختياري)"))}</label><input name="email" type="email" autocomplete="email" dir="ltr">
      ${c.place === "both" ? `<label>${esc(T("Where", "المكان"))}</label><select name="place"><option value="clinic">${esc(T("At your place", "في مقركم"))}</option><option value="home">${esc(T("At my home", "في منزلي"))}</option></select>` : `<input type="hidden" name="place" value="${c.place === "home" ? "home" : "clinic"}">`}
      ${c.place === "home" || c.place === "both" ? `<div id="addr"><label>${esc(T("Address", "العنوان"))}</label><input name="address" autocomplete="street-address"><label>${esc(T("Area", "المنطقة"))}</label><input name="zone"></div>` : ""}
      <label>${esc(T("Notes (optional)", "ملاحظات (اختياري)"))}</label><textarea name="notes"></textarea>
      <div style="margin-top:16px"><button class="btn pri full">${esc(T("Confirm booking — ", "تأكيد الحجز — ") + fmtDate(B.day) + " " + B.time)}</button></div><div id="err" hidden></div></form></div>`) : "");
  main().querySelectorAll("[data-svc]").forEach(b => b.onclick = () => { B.svc = svcs[+b.dataset.svc]; B.time = null; bookingView(); });
  main().querySelectorAll("[data-day]").forEach(b => b.onclick = () => { B.day = b.dataset.day; B.time = null; bookingView(); });
  main().querySelectorAll("[data-time]").forEach(b => b.onclick = () => { B.time = b.dataset.time; bookingView(); const f = $("#bf") || $("#mv"); if (f) f.scrollIntoView({ behavior: "smooth", block: "center" }); });
  const pl = $("[name=place]"); if (pl && pl.tagName === "SELECT") { const sync = () => { $("#addr").hidden = pl.value !== "home"; }; pl.onchange = sync; sync(); }
  const f = $("#bf"); if (f) f.onsubmit = async e => { e.preventDefault(); const btn = $("button", f); btn.disabled = true;
    const v = Object.fromEntries(new FormData(f).entries()), slot = `${B.day} ${B.time}`;
    try { const r = await rpc("public_send", { p_token: TOK, p_kind: "booking", p_payload: { ...v, slot, service: B.svc ? B.svc.name : "", service_id: B.svc ? B.svc.id : null, ...(priceOf(B.svc) ? { price: +B.svc.price } : {}) } });
      store.set("bk:" + TOK, { ref: r.ref, manage: r.manage, slot }); location.hash = `t=${encodeURIComponent(TOK)}&r=${encodeURIComponent(r.ref)}&m=${encodeURIComponent(r.manage)}&new=1`; }
    catch (x) { btn.disabled = false; fail(x); if (/taken/i.test(x.message)) { await reload(); } } };
  const mv = $("#mv"); if (mv) mv.onclick = async () => { mv.disabled = true;
    try { await rpc("public_manage", { p_token: TOK, p_ref: hp.get("r"), p_manage: hp.get("m"), p_action: "move", p_slot: `${B.day} ${B.time}` });
      const mine2 = store.get("bk:" + TOK); if (mine2) store.set("bk:" + TOK, { ...mine2, slot: `${B.day} ${B.time}` }); B.moving = false; B.time = null; render(); }
    catch (x) { mv.disabled = false; fail(x); } };
}
function ics(slot, minutes) {
  const [d, t] = slot.split(" "), s = new Date(`${d}T${t}:00`), e = new Date(s.getTime() + (minutes || 30) * 60000);
  const f = x => x.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//BeyondERP//Booking//EN", "BEGIN:VEVENT", `UID:${Date.now()}@beyonderp`, `DTSTAMP:${f(new Date())}`,
    `DTSTART:${f(s)}`, `DTEND:${f(e)}`, `SUMMARY:${(PG.company || "") + " — " + (PG.title || "Booking")}`, "BEGIN:VALARM", "TRIGGER:-PT2H", "ACTION:DISPLAY", "DESCRIPTION:Reminder", "END:VALARM",
    "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", "DESCRIPTION:Reminder", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  return URL.createObjectURL(new Blob([body], { type: "text/calendar" }));
}
async function manageView() {
  const ref = hp.get("r"), m = hp.get("m");
  let d; try { d = await rpc("public_manage", { p_token: TOK, p_ref: ref, p_manage: m }); } catch (e) { main().innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  if (d.kind === "message") return guestView(d);
  const msgs = d.messages || [], declined = d.status === "rejected", cancelled = !d.slot && !declined;
  const lastConf = msgs.filter(x => x.direction === "out" && x.kind === "confirm").pop(), lastMove = msgs.filter(x => x.kind === "reschedule").pop(),
        conf = lastConf && !(lastMove && lastMove.id > lastConf.id) ? lastConf : null, notes = msgs.filter(x => x.direction === "out" && x.body);
  const st = declined ? `<span class="chip bad">${esc(T("Declined", "مرفوض"))}</span>` : cancelled ? `<span class="chip bad">${esc(T("Cancelled", "ملغى"))}</span>` : conf ? `<span class="chip ok">${esc(T("Confirmed", "مؤكد"))}</span>` : `<span class="chip">${esc(T("Received — waiting for confirmation", "تم الاستلام — في انتظار التأكيد"))}</span>`;
  const svc = (d.payload && d.payload.service) || "";
  main().innerHTML = `<div class="card">${hp.get("new") ? `<div class="big-ok ok">✓</div><h1>${esc(T("Booking received", "تم استلام الحجز"))}</h1>` : `<h1>${esc(T("Your booking", "حجزك"))}</h1>`}
    <p>${st}</p>${d.slot ? `<p style="font-size:1.15em"><b>${esc(fmtDate(d.slot.slice(0, 10)))}</b> — <b>${esc(d.slot.slice(11))}</b></p>` : ""}
    ${svc ? `<p class="muted">${esc(svc)}${priceOf((PG.config.services || []).find(s => s.name === svc)) ? ` — <b>${esc(priceOf((PG.config.services || []).find(s => s.name === svc)))}</b>` : ""}</p>` : ""}<p class="muted small">${esc(T("Reference", "رقم الحجز"))}: <b>${esc(ref)}</b></p>
    ${notes.length ? `<div class="card" style="box-shadow:none">${notes.map(n => `<p style="margin:4px 0">💬 ${esc(n.body)}</p>`).join("")}</div>` : ""}
    ${d.slot && !declined ? `<div class="row" style="margin-top:12px"><a class="btn" id="cal" download="booking.ics">📅 ${esc(T("Add to my calendar", "أضف إلى التقويم"))}</a>
      <button class="btn" id="move">${esc(T("Change time", "تغيير الموعد"))}</button><button class="btn bad" id="cancel">${esc(T("Cancel", "إلغاء الحجز"))}</button></div>` : ""}
    <div id="err" hidden></div>
    <p class="muted small" style="margin-top:16px">${esc(T("Keep this page's link to come back to your booking — it is saved on this device too.", "احتفظ برابط هذه الصفحة للرجوع إلى حجزك — وهو محفوظ على هذا الجهاز أيضاً."))}</p></div>
    ${!d.slot ? `<a class="btn pri" href="#t=${encodeURIComponent(TOK)}">${esc(T("Make a new booking", "حجز جديد"))}</a>` : ""}`;
  const cal = $("#cal"); if (cal) cal.href = ics(d.slot, (PG.config.services || []).concat([]).find(s => s.name === svc)?.minutes || PG.config.slot);
  const mv = $("#move"); if (mv) mv.onclick = () => { B.moving = true; B.svc = (PG.config.services || []).find(s => s.name === svc) || null; B.day = null; B.time = null; bookingView(); };
  const cn = $("#cancel"); if (cn) cn.onclick = async () => { if (!window.confirm(T("Cancel this booking?", "هل تريد إلغاء هذا الحجز؟"))) return; cn.disabled = true;
    try { await rpc("public_manage", { p_token: TOK, p_ref: ref, p_manage: m, p_action: "cancel" }); store.set("bk:" + TOK, null); hp.delete("new"); manageView(); } catch (e) { cn.disabled = false; fail(e); } };
}

// ---------------------------------------------------------------- web form
function formView() {
  const c = PG.config, fields = c.fields && c.fields.length ? c.fields : [{ k: "name", label: "Full name", label_ar: "الاسم", required: true }, { k: "phone", label: "Mobile", label_ar: "الموبايل", type: "tel", required: true },
    { k: "email", label: "Email", label_ar: "البريد الإلكتروني", type: "email" }, { k: "message", label: "How can we help?", label_ar: "كيف يمكننا مساعدتك؟", type: "textarea" }];
  const lbl = f => L === "ar" && f.label_ar ? f.label_ar : f.label || f.k;
  main().innerHTML = `<div class="card"><h1>${esc(ttl() || T("Contact us", "تواصل معنا"))}</h1>${c.intro ? `<p class="muted">${esc(c.intro)}</p>` : ""}<form id="ff">
    ${fields.map(f => `<label>${esc(lbl(f))}${f.required ? " *" : ""}</label>${f.type === "textarea" ? `<textarea name="${esc(f.k)}" ${f.required ? "required" : ""}></textarea>` :
      f.type === "select" ? `<select name="${esc(f.k)}" ${f.required ? "required" : ""}><option value=""></option>${(f.options || []).map(o => `<option>${esc(o)}</option>`).join("")}</select>` :
      `<input name="${esc(f.k)}" type="${esc(f.type || "text")}" ${f.required ? "required" : ""} ${/tel|email/.test(f.type || "") ? 'dir="ltr"' : ""}>`}`).join("")}
    <div style="margin-top:16px"><button class="btn pri full">${esc(T("Send", "إرسال"))}</button></div><div id="err" hidden></div></form></div>`;
  $("#ff").onsubmit = async e => { e.preventDefault(); const btn = $("#ff button"); btn.disabled = true;
    const v = Object.fromEntries(new FormData(e.target).entries()), named = {};
    fields.forEach(f => { if (v[f.k]) named[f.label || f.k] = v[f.k]; });
    try { await rpc("public_send", { p_token: TOK, p_kind: "lead", p_payload: { name: v.name || v[fields[0].k] || "", phone: v.phone || "", email: v.email || "", fields: named } });
      main().innerHTML = `<div class="card"><div class="big-ok ok">✓</div><h1>${esc(c.thanks || T("Thank you — we'll be in touch soon.", "شكراً لك — سنتواصل معك قريباً."))}</h1></div>`; }
    catch (x) { btn.disabled = false; fail(x); } };
}

// ---------------------------------------------------------------- signing an offer
function signView() {
  const c = PG.config, done = store.get("sg:" + TOK);
  const money = n => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  main().innerHTML = `<div class="card doc"><h1>${esc(c.title || T("Offer", "عرض"))} ${esc(c.number || "")}</h1>
    <p class="muted">${esc([c.client, c.project, c.date].filter(Boolean).join(" · "))}</p>
    ${(c.sections || []).map(s => s.items ? `<h2 style="margin-top:16px">${esc(s.heading || T("Prices", "الأسعار"))}</h2><table>${s.items.map(i => `<tr><td>${esc(i.desc)}</td><td class="n">${money(i.amount)}</td></tr>`).join("")}
        ${s.discount ? `<tr><td>${esc(T("Discount", "خصم"))}</td><td class="n">−${money(s.discount)}</td></tr>` : ""}${s.vat ? `<tr><td>${esc(T("VAT", "ضريبة القيمة المضافة"))} ${s.vat_pct || ""}%</td><td class="n">${money(s.vat)}</td></tr>` : ""}
        <tr><td><b>${esc(T("Total", "الإجمالي"))}</b></td><td class="n"><b>${money(s.net)}</b></td></tr></table>`
      : `<h2 style="margin-top:16px">${esc(s.heading || "")}</h2><p>${esc(s.body)}</p>`).join("")}</div>` +
    (done ? `<div class="card"><div class="big-ok ok">✓</div><h1>${esc(T("Signed — thank you", "تم التوقيع — شكراً لك"))}</h1><p class="muted">${esc(T("Signed by", "وقّع بواسطة"))} ${esc(done.name)} · ${esc(done.at)}</p></div>` :
    `<div class="card"><h2>${esc(T("Sign to accept", "وقّع للموافقة"))}</h2><form id="sf"><label>${esc(T("Your full name", "اسمك بالكامل"))} *</label><input name="name" required autocomplete="name">
      <label>${esc(T("Sign here", "وقّع هنا"))} *</label><canvas class="sig" id="cv"></canvas><div class="row"><span class="sp"></span><button type="button" class="btn" id="clr">${esc(T("Clear", "مسح"))}</button></div>
      <label><input type="checkbox" name="ok" required style="width:auto;margin-inline-end:8px">${esc(T("I accept this offer and its terms", "أوافق على هذا العرض وشروطه"))}</label>
      <label>${esc(T("Comment (optional)", "تعليق (اختياري)"))}</label><textarea name="comment"></textarea>
      <div style="margin-top:16px"><button class="btn pri full">${esc(T("Sign and accept", "توقيع وموافقة"))}</button></div><div id="err" hidden></div></form></div>`);
  if (done) return;
  const cv = $("#cv"), ctx = cv.getContext("2d"); let drawn = false, last = null;
  const fit = () => { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = getComputedStyle(document.body).color; };
  fit();
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); last = pt(e); };
  cv.onpointermove = e => { if (!last) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; drawn = true; };
  cv.onpointerup = cv.onpointercancel = () => { last = null; };
  $("#clr").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); drawn = false; };
  $("#sf").onsubmit = async e => { e.preventDefault(); if (!drawn) return fail(new Error(T("Please sign in the box", "من فضلك وقّع داخل المربع")));
    const btn = $("#sf button[class*=pri]"); btn.disabled = true;
    // the signature in dark ink on white, at most 600×200 (small enough to send)
    const out = document.createElement("canvas"), w = Math.min(600, cv.width), h = Math.round(w * cv.height / cv.width); out.width = w; out.height = h;
    const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, w, h); o.drawImage(cv, 0, 0, w, h);
    const id = o.getImageData(0, 0, w, h); for (let i = 0; i < id.data.length; i += 4) { const lum = id.data[i] + id.data[i + 1] + id.data[i + 2]; if (lum < 720 && id.data[i + 3] > 0) { const dark = lum > 380 ? 20 : id.data[i]; id.data[i] = id.data[i + 1] = id.data[i + 2] = Math.min(dark, 30); } } o.putImageData(id, 0, 0);
    const v = Object.fromEntries(new FormData(e.target).entries());
    try { await rpc("public_send", { p_token: TOK, p_kind: "signature", p_payload: { offer_id: c.offer_id, name: v.name, comment: v.comment || "", image: out.toDataURL("image/png") } });
      store.set("sg:" + TOK, { name: v.name, at: new Date().toLocaleString() }); signView(); }
    catch (x) { btn.disabled = false; fail(x); } };
}

// ---------------------------------------------------------------- chatting with the company as a guest
let poll = null;
async function guestView(pre) {
  const c = PG.config, mine = store.get("gc:" + TOK);
  clearInterval(poll);
  if (!mine) {
    main().innerHTML = `<div class="card"><h1>${esc(ttl() || T("Chat with us", "تحدث معنا"))}</h1>${c.intro ? `<p class="muted">${esc(c.intro)}</p>` : ""}<form id="gf">
      <label>${esc(T("Your name", "اسمك"))} *</label><input name="name" required autocomplete="name">
      <label>${esc(T("Mobile (optional)", "الموبايل (اختياري)"))}</label><input name="phone" inputmode="tel" dir="ltr">
      <label>${esc(T("Your message", "رسالتك"))} *</label><textarea name="body" required></textarea>
      <div style="margin-top:16px"><button class="btn pri full">${esc(T("Start the chat", "ابدأ المحادثة"))}</button></div><div id="err" hidden></div></form></div>`;
    $("#gf").onsubmit = async e => { e.preventDefault(); const btn = $("#gf button"); btn.disabled = true; const v = Object.fromEntries(new FormData(e.target).entries());
      try { const r = await rpc("public_send", { p_token: TOK, p_kind: "message", p_payload: v }); store.set("gc:" + TOK, { ref: r.ref, manage: r.manage, name: v.name }); guestView(); }
      catch (x) { btn.disabled = false; fail(x); } };
    return;
  }
  main().innerHTML = `<div class="card"><h2>${esc(ttl() || T("Chat with us", "تحدث معنا"))}</h2><div class="msgs" id="ms"></div>
    <form id="gs" class="row" style="margin-top:12px"><textarea name="body" required style="min-height:46px;flex:1" placeholder="${esc(T("Write a message…", "اكتب رسالة…"))}"></textarea><button class="btn pri">${esc(T("Send", "إرسال"))}</button></form><div id="err" hidden></div>
    <p class="muted small">${esc(T("We usually answer during working hours. Keep this page open or come back later — your chat is saved on this device.", "نرد عادة خلال ساعات العمل. اترك الصفحة مفتوحة أو عد لاحقاً — محادثتك محفوظة على هذا الجهاز."))}</p></div>`;
  const draw = d => { const box = $("#ms"); if (!box) return; const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = (d.messages || []).filter(x => x.body).map(x => `<div class="msg ${x.direction === "in" ? "me" : ""}">${esc(x.body)}<small>${esc(new Date(x.at).toLocaleString(L === "ar" ? "ar-EG" : "en-GB", { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }))}</small></div>`).join("");
    if (atEnd) box.scrollTop = box.scrollHeight; };
  const load = async () => { try { draw(await rpc("public_manage", { p_token: TOK, p_ref: mine.ref, p_manage: mine.manage })); } catch {} };
  if (pre) draw(pre); else await load();
  $("#ms").scrollTop = 1e9;
  poll = setInterval(() => { if (document.visibilityState === "visible") load(); }, 6000);
  $("#gs").onsubmit = async e => { e.preventDefault(); const ta = $("#gs textarea"), body = ta.value.trim(); if (!body) return;
    try { await rpc("public_send", { p_token: TOK, p_kind: "message", p_payload: { body, name: mine.name }, p_ref: mine.ref, p_manage: mine.manage }); ta.value = ""; load(); } catch (x) { fail(x); } };
  $("#gs textarea").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer: fine)").matches) { e.preventDefault(); $("#gs").requestSubmit(); } };
}

async function reload() { PG = await rpc("public_page", { p_token: TOK }); }
async function render() {
  header();
  if (!PG) return;
  clearInterval(poll);
  if (PG.kind === "booking") return hp.get("r") && !B.moving ? manageView() : bookingView();
  if (PG.kind === "form") return formView();
  if (PG.kind === "sign") return signView();
  if (PG.kind === "guest") return guestView();
}
window.addEventListener("hashchange", () => { const n = new URLSearchParams(location.hash.slice(1)); if ((n.get("t") || "") !== TOK) return location.reload(); [...hp.keys()].forEach(k => hp.delete(k)); n.forEach((v, k) => hp.set(k, v)); B.moving = false; render(); });
(async () => {
  header();
  if (!TOK) { main().innerHTML = `<div class="card">${esc(T("This link is incomplete.", "هذا الرابط غير مكتمل."))}</div>`; return; }
  try { await reload(); } catch (e) { main().innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  if (PG.config && PG.config.lang && !localStorage.getItem("berp.p.lang")) L = PG.config.lang === "ar" ? "ar" : "en";
  render();
})();
})();
</script>
</body>
